name: ios-release
# Manual only: nothing runs on push, so no build is wasted.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0-alpha). Empty = build only, upload as artifact."
        required: false
        default: ""
permissions:
  contents: write
  actions: write
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup target add aarch64-apple-ios
      - name: Test memory controls and package contracts
        run: |
          python3 tools/test_ios_memory_contract.py
          python3 tools/test_gen_source.py
          rustc --edition=2024 --test crates/diag/src/memory_settings.rs -o /tmp/memory-settings-tests
          /tmp/memory-settings-tests
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ios-ipa-${{ hashFiles('Cargo.lock') }}
          # Cargo.lock changes with every version bump, so the exact key almost never hits.
          # Fall back to the newest earlier cache: cargo then rebuilds only what changed.
          restore-keys: |
            ios-ipa-
      - name: Build iw4l for iOS
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -e -o pipefail
          IW4L_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/Info.plist)"
          case "$IW4L_BUILD_NUMBER" in
            ''|*[!0-9]*) echo "CFBundleVersion must be a non-empty numeric build number" >&2; exit 1 ;;
          esac
          export IW4L_BUILD_NUMBER
          cargo build --profile ios --target aarch64-apple-ios -p launcher --bin iw4l 2>&1 | tee build.log
      - name: Package unsigned IPA
        run: |
          set -e
          rm -rf Payload && mkdir -p Payload/IW4L.app
          cp target/aarch64-apple-ios/ios/iw4l Payload/IW4L.app/iw4l
          cp ios/Info.plist Payload/IW4L.app/Info.plist
          cp ios/icons/AppIcon60x60* ios/icons/AppIcon76x76* ios/icons/AppIcon83.5x83.5* Payload/IW4L.app/
          file Payload/IW4L.app/iw4l
          zip -qr "IW4 Pocket.ipa" Payload
          ls -lh "IW4 Pocket.ipa"
      - name: Verify packaged IPA before publication
        run: python3 tools/verify_ios_ipa.py "IW4 Pocket.ipa" --report ipa-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IW4L-ipa
          path: |
            IW4 Pocket.ipa
            build.log
            ipa-verification.json
      - name: Publish release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "IW4 Pocket.ipa" ipa-verification.json \
            --target "$GITHUB_SHA" \
            --title "IW4 Pocket $RELEASE_TAG" \
            --prerelease \
            --notes-file RELEASE_NOTES.md
          # A release made with this token cannot start other workflows by itself, but a
          # direct dispatch is allowed: SideStore's source.json follows the new release.
          gh workflow run update-source.yml --ref main -f tag="$RELEASE_TAG"
